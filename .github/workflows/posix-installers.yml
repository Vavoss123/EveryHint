name: macOS and Linux installers

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: mac-arm64
            target: mac
          - runner: macos-15-intel
            label: mac-x64
            target: mac
          - runner: ubuntu-22.04
            label: linux-x64
            target: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - name: Match release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if(process.env.RELEASE_TAG && process.env.RELEASE_TAG!=='v'+require('./package.json').version)throw Error('Tag must match package.json')"
      - name: Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libgtk-3-0 libnss3 libasound2 libsecret-1-0 gnome-keyring dbus-x11 xvfb pulseaudio-utils libfuse2
      - run: npm ci
      - run: npm run check
      - name: Build native speech helper
        run: npm run speech:build -- --speech-home "$PWD/artifacts/release-speech"
      - run: npm run dist:${{ matrix.target }}
      - name: Check native package integrity
        run: npm run package:audit-posix
      - name: Verify macOS packaged app and persistent keychain
        if: runner.os == 'macOS'
        run: npm run smoke:posix
      - name: Configure the native Chromium sandbox on the disposable Linux runner
        if: runner.os == 'Linux'
        run: sudo chown root:root release/linux-unpacked/chrome-sandbox && sudo chmod 4755 release/linux-unpacked/chrome-sandbox
      - name: Verify Linux packaged app and persistent Secret Service
        if: runner.os == 'Linux'
        run: bash scripts/linux-desktop-smoke.sh
      - run: npm run package:checksums-posix
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: EveryHint-${{ matrix.label }}
          path: |
            release/EveryHint-*.dmg
            release/EveryHint-*.zip
            release/EveryHint-*.AppImage
            release/EveryHint-*.deb
            release/EveryHint-*.sha256
            artifacts/package-*.json
            artifacts/smoke-*.json
          if-no-files-found: error
          compression-level: 0
      - name: Attach native downloads to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/upload-posix-release.mjs
