extends: ./electron-builder.common.yml
extraFiles:
  - from: artifacts/release-vc-runtime
    to: .
    filter:
      - vcruntime140.dll
extraResources:
  - from: artifacts/release-speech/runtime
    to: speech
    filter:
      - everyhint-transcriber.exe
      - whisper-LICENSE
  - from: artifacts/release-vc-runtime/manifest.json
    to: vc-runtime-manifest.json
  - from: build/VC-RUNTIME-NOTICES.txt
    to: VC-RUNTIME-NOTICES.txt
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: true
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: EveryHint
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: EveryHint-Setup-${version}.${ext}
